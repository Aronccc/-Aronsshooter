<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易 3D 射擊遊戲</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* 遊戲 UI 覆蓋層 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊穿透到 Canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 抬頭顯示器 (HUD) */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-text {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px #00ffcc;
        }

        .rank-text {
            color: #ffaa00;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 0 10px #ff4400;
            margin-top: 5px;
        }

        .status-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .health-bar-container {
            width: 200px;
            height: 24px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            overflow: hidden;
            position: relative; /* 用於定位百分比文字 */
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: #00ffcc;
            transition: width 0.2s, background-color 0.2s;
        }

        #health-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 2;
        }

        /* 技能區塊容器 */
        .skills-wrapper {
            display: flex;
            gap: 10px; /* 技能之間的間距 */
        }

        /* 技能 UI */
        .skill-container {
            position: relative;
            width: 60px;
            height: 60px;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .skill-icon {
            font-size: 24px;
            color: #00ffcc;
            z-index: 2;
        }

        .skill-key {
            font-size: 12px;
            color: #fff;
            position: absolute;
            bottom: 2px;
            right: 4px;
            z-index: 2;
        }

        /* 冷卻遮罩 */
        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; /* 0% = 準備好, 100% = 冷卻中 */
            background: rgba(0, 0, 0, 0.8);
            z-index: 1;
            transition: height 0.1s linear;
        }

        .skill-timer {
            position: absolute;
            font-size: 20px;
            color: white;
            font-weight: bold;
            z-index: 3;
            display: none;
        }

        /* 準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        #crosshair::before {
            top: 9px; left: 0; width: 20px; height: 2px;
        }
        #crosshair::after {
            top: 0; left: 9px; width: 2px; height: 20px;
        }

        /* 開始/暫停/結束畫面 */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            pointer-events: auto;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }

        /* 效果遮罩 (受傷紅/補血綠) */
        #effect-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            background: transparent;
        }

        /* 護盾專用特效層 */
        #shield-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: inset 0 0 100px rgba(0, 200, 255, 0.6);
            border: 4px solid rgba(0, 200, 255, 0.4);
            background: radial-gradient(circle, transparent 60%, rgba(0, 200, 255, 0.2) 100%);
        }

    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 遊戲 UI -->
    <div id="ui-layer">
        <div class="hud-top">
            <div>
                <div class="hud-text">得分: <span id="score">0</span></div>
                <div class="rank-text" id="rank">實習生</div>
            </div>
            
            <div class="status-area">
                <div class="health-bar-container">
                    <div id="health-text">100%</div>
                    <div id="health-bar"></div>
                </div>
                
                <div class="skills-wrapper">
                    <!-- 技能 1: 補血 -->
                    <div class="skill-container">
                        <div class="skill-icon">➕</div>
                        <div class="skill-key">F</div>
                        <div id="skill-heal-overlay" class="cooldown-overlay"></div>
                        <div id="skill-heal-timer" class="skill-timer">10</div>
                    </div>

                    <!-- 技能 2: 護盾 -->
                    <div class="skill-container" style="border-color: #00ccff;">
                        <div class="skill-icon" style="color: #00ccff;">🛡️</div>
                        <div class="skill-key">Space</div>
                        <div id="skill-shield-overlay" class="cooldown-overlay"></div>
                        <div id="skill-shield-timer" class="skill-timer">15</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="hud-text" style="font-size: 14px; opacity: 0.7;">WASD 移動 | 左鍵 射擊 | F 補血 | 空白鍵 護盾</div>
    </div>

    <!-- 準心 -->
    <div id="crosshair"></div>

    <!-- 視覺特效層 -->
    <div id="effect-overlay"></div>
    <div id="shield-overlay"></div>

    <!-- 選單畫面 -->
    <div id="menu-screen">
        <h1 id="game-title">幾何射擊 3D：進化</h1>
        <p>瞄準頭部傷害加倍！</p>
        <button id="start-btn">點擊開始</button>
    </div>

    <script>
        // --- 遊戲變數 ---
        let camera, scene, renderer;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // 遊戲狀態
        let isGameActive = false;
        let score = 0;
        let health = 100;
        let lastEnemySpawnTime = 0;
        let enemySpawnRate = 2000; 
        
        // 地圖邊界參數
        const MAP_SIZE = 200; 
        const BOUNDARY_LIMIT = (MAP_SIZE / 2) - 2; 

        // 技能狀態
        const SKILL_HEAL_CD = 10000; 
        let lastHealUseTime = -SKILL_HEAL_CD; 

        const SKILL_SHIELD_CD = 15000; 
        const SHIELD_DURATION = 3000; 
        let lastShieldUseTime = -SKILL_SHIELD_CD;
        let isShieldActive = false;

        // 物件陣列
        const bullets = [];
        const enemies = [];
        const particles = []; 

        // DOM 元素
        const scoreEl = document.getElementById('score');
        const rankEl = document.getElementById('rank');
        const healthBarEl = document.getElementById('health-bar');
        const healthTextEl = document.getElementById('health-text');
        const menuScreen = document.getElementById('menu-screen');
        const startBtn = document.getElementById('start-btn');
        const gameTitle = document.getElementById('game-title');
        const effectOverlay = document.getElementById('effect-overlay');
        const shieldOverlay = document.getElementById('shield-overlay');

        // 技能 UI
        const healOverlay = document.getElementById('skill-heal-overlay');
        const healTimer = document.getElementById('skill-heal-timer');
        const shieldUiOverlay = document.getElementById('skill-shield-overlay');
        const shieldTimer = document.getElementById('skill-shield-timer');

        // 敵人配置 (HP 略為增加以適應雙倍傷害)
        const EnemyTypes = {
            YELLOW: { color: 0xffff00, speed: 0.08, hp: 2, score: 10, scale: 0.8, maxHp: 2 },
            RED:    { color: 0xff0000, speed: 0.05, hp: 4, score: 30, scale: 1.0, maxHp: 4 },
            PURPLE: { color: 0x800080, speed: 0.03, hp: 8, score: 100, scale: 1.5, maxHp: 8 },
            BLUE:   { color: 0x0088ff, speed: 0.06, hp: 3, score: 50, scale: 0.9, isHealer: true, maxHp: 3 } 
        };

        // --- 初始化 ---
        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 0, 75); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6; 
            camera.rotation.order = "YXZ"; 

            const ambientLight = new THREE.AmbientLight(0x404040); 
            scene.add(ambientLight);
            
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);

            const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            const floorGeometry = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 100, 100);
            floorGeometry.rotateX(-Math.PI / 2);
            
            const floorMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ffcc, 
                wireframe: true,
                transparent: true,
                opacity: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            scene.add(floor);

            createBoundaries();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            
            startBtn.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isGameActive = true;
                    menuScreen.style.display = 'none';
                    if (health <= 0) resetGame();
                } else {
                    isGameActive = false;
                    menuScreen.style.display = 'flex';
                    gameTitle.innerText = "遊戲暫停";
                    startBtn.innerText = "繼續遊戲";
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (isGameActive) {
                    const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                    const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

                    camera.rotation.y -= movementX * 0.002;
                    camera.rotation.x -= movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                }
            });
        }

        function createBoundaries() {
            const wallMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ffcc, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.15,
                side: THREE.DoubleSide 
            });
            const wallHeight = 20;

            const wallGeo = new THREE.PlaneGeometry(MAP_SIZE, wallHeight, 20, 5);
            
            const wallN = new THREE.Mesh(wallGeo, wallMaterial);
            wallN.position.set(0, wallHeight/2, -MAP_SIZE/2);
            scene.add(wallN);

            const wallS = new THREE.Mesh(wallGeo, wallMaterial);
            wallS.position.set(0, wallHeight/2, MAP_SIZE/2);
            scene.add(wallS);

            const wallE = new THREE.Mesh(wallGeo, wallMaterial);
            wallE.rotation.y = -Math.PI / 2;
            wallE.position.set(MAP_SIZE/2, wallHeight/2, 0);
            scene.add(wallE);

            const wallW = new THREE.Mesh(wallGeo, wallMaterial);
            wallW.rotation.y = Math.PI / 2;
            wallW.position.set(-MAP_SIZE/2, wallHeight/2, 0);
            scene.add(wallW);
        }

        function resetGame() {
            score = 0;
            health = 100;
            lastHealUseTime = -SKILL_HEAL_CD;
            lastShieldUseTime = -SKILL_SHIELD_CD;
            isShieldActive = false;
            shieldOverlay.style.opacity = 0;
            updateUI();
            
            enemies.forEach(e => scene.remove(e.group)); // 修改為 group
            enemies.length = 0;
            
            bullets.forEach(b => scene.remove(b.mesh));
            bullets.length = 0;

            camera.position.set(0, 1.6, 0);
            camera.rotation.set(0, 0, 0);
            effectOverlay.style.opacity = 0;
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'KeyF': useHealSkill(); break; 
                case 'Space': useShieldSkill(); break; 
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseDown(event) {
            if (!isGameActive || health <= 0) return;
            if (event.button === 0) shoot();
        }

        function useHealSkill() {
            if (!isGameActive || health <= 0) return;
            const now = performance.now();
            if (now - lastHealUseTime >= SKILL_HEAL_CD) {
                healPlayer(40);
                lastHealUseTime = now;
            }
        }

        function useShieldSkill() {
            if (!isGameActive || health <= 0) return;
            const now = performance.now();
            if (now - lastShieldUseTime >= SKILL_SHIELD_CD) {
                isShieldActive = true;
                lastShieldUseTime = now;
                shieldOverlay.style.opacity = 1;
                setTimeout(() => {
                    isShieldActive = false;
                    shieldOverlay.style.opacity = 0;
                }, SHIELD_DURATION);
            }
        }

        function healPlayer(amount) {
            health += amount;
            if (health > 100) health = 100;
            updateUI();
            effectOverlay.style.background = 'radial-gradient(circle, transparent 20%, rgba(0, 255, 0, 0.4) 100%)';
            effectOverlay.style.opacity = 0.8;
            setTimeout(() => { if (health > 0) effectOverlay.style.opacity = 0; }, 300);
        }

        function shoot() {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(geometry, material);

            bullet.position.copy(camera.position);
            bullet.position.y -= 0.2;

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            bullets.push({
                mesh: bullet,
                velocity: direction.multiplyScalar(0.8),
                life: 100
            });

            scene.add(bullet);
            camera.rotation.x += 0.01; 
        }

        // --- 新增敵人生成邏輯 (包含頭部與血條) ---
        function spawnEnemy() {
            let typeConfig = EnemyTypes.YELLOW;
            const rand = Math.random();
            
            if (rand < 0.1) typeConfig = EnemyTypes.BLUE;
            else if (rand < 0.25) typeConfig = EnemyTypes.PURPLE;
            else if (rand < 0.55) typeConfig = EnemyTypes.RED;
            else typeConfig = EnemyTypes.YELLOW;

            // 1. 創建群組
            const group = new THREE.Group();

            // 2. 身體
            const bodyGeo = new THREE.BoxGeometry(1, 1, 1);
            const bodyMat = new THREE.MeshPhongMaterial({ color: typeConfig.color, shininess: 100 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5; // 讓底部對齊 0
            group.add(body);

            // 3. 頭部 (顏色稍深一點或相同)
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshPhongMaterial({ color: typeConfig.color, shininess: 100 });
            // 將顏色調亮一點代表頭部
            headMat.color.offsetHSL(0, 0, 0.1); 
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.3; // 身體高度(1) + 一點間隙
            group.add(head);

            // 4. 血量條背景 (黑條)
            const hpBgGeo = new THREE.PlaneGeometry(1.2, 0.15);
            const hpBgMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
            const hpBg = new THREE.Mesh(hpBgGeo, hpBgMat);
            hpBg.position.y = 1.9; // 頭頂上方
            group.add(hpBg);

            // 5. 血量條前景 (紅條)
            const hpFgGeo = new THREE.PlaneGeometry(1.2, 0.15);
            const hpFgMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
            const hpFg = new THREE.Mesh(hpFgGeo, hpFgMat);
            hpFg.position.y = 1.9;
            hpFg.position.z = 0.01; // 稍微往前一點避免重疊閃爍
            // 為了讓縮放從左邊開始，我們需要將幾何中心移到左邊，或者在縮放時調整位置
            // 這裡使用簡單的 scale.x 修改，視覺上會向中心縮放，為了簡單起見先這樣，或者我們可以用父子層級來做左對齊
            group.add(hpFg);

            // 應用縮放
            group.scale.set(typeConfig.scale, typeConfig.scale, typeConfig.scale);

            // 生成位置
            const angle = Math.random() * Math.PI * 2;
            const radius = 25 + Math.random() * 25;
            const spawnRadius = (MAP_SIZE / 2) - 5; 
            let spawnX = Math.cos(angle) * radius + camera.position.x;
            let spawnZ = Math.sin(angle) * radius + camera.position.z;
            spawnX = Math.max(-spawnRadius, Math.min(spawnRadius, spawnX));
            spawnZ = Math.max(-spawnRadius, Math.min(spawnRadius, spawnZ));

            group.position.set(spawnX, 0, spawnZ);

            enemies.push({
                group: group, // 這裡存的是 group
                mesh: group, // 相容舊邏輯的變數名 (實際上是 group)
                headMesh: head,
                hpBarMesh: hpFg,
                type: typeConfig,
                currentHp: typeConfig.maxHp, // 使用配置的 maxHp
                maxHp: typeConfig.maxHp,
                speed: typeConfig.speed + (score * 0.0001)
            });

            scene.add(group);
        }

        function createExplosion(position, color, isCrit) {
            const count = isCrit ? 16 : 8;
            const pColor = isCrit ? 0xffff00 : color; // 暴擊時噴黃色粒子
            
            for (let i = 0; i < count; i++) {
                const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const mat = new THREE.MeshBasicMaterial({ color: pColor });
                const part = new THREE.Mesh(geo, mat);
                part.position.copy(position);
                
                particles.push({
                    mesh: part,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * (isCrit? 1 : 0.5),
                        (Math.random() - 0.5) * (isCrit? 1 : 0.5),
                        (Math.random() - 0.5) * (isCrit? 1 : 0.5)
                    ),
                    life: 20
                });
                scene.add(part);
            }
        }

        function updateProximityWarning() {
            if (enemies.length === 0 || isShieldActive) { 
                if (effectOverlay.style.background.includes('rgba(255, 0, 0')) {
                    effectOverlay.style.opacity = 0;
                }
                return;
            }

            let nearestEnemy = null;
            let minDistance = Infinity;

            enemies.forEach(e => {
                const dist = camera.position.distanceTo(e.group.position);
                if (dist < minDistance) {
                    minDistance = dist;
                    nearestEnemy = e;
                }
            });

            if (nearestEnemy && minDistance < 15) {
                const intensity = Math.max(0, (15 - minDistance) / 15);
                const enemyDir = new THREE.Vector3().subVectors(nearestEnemy.group.position, camera.position).normalize();
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                
                const camRight = new THREE.Vector3();
                camRight.crossVectors(camDir, new THREE.Vector3(0, 1, 0));
                
                const dotRight = enemyDir.dot(camRight); 
                const dotForward = enemyDir.dot(camDir); 

                let gradient = '';

                if (dotForward < -0.5) {
                    gradient = `linear-gradient(to top, rgba(255,0,0,${intensity}) 0%, transparent 50%)`;
                } else if (dotRight > 0.3) {
                    gradient = `linear-gradient(to left, rgba(255,0,0,${intensity}) 0%, transparent 50%)`;
                } else if (dotRight < -0.3) {
                    gradient = `linear-gradient(to right, rgba(255,0,0,${intensity}) 0%, transparent 50%)`;
                } else {
                    gradient = `radial-gradient(circle, transparent 50%, rgba(255, 0, 0, ${intensity}) 100%)`;
                }
                
                if (!effectOverlay.style.background.includes('rgba(0, 255, 0')) {
                    effectOverlay.style.background = gradient;
                    const pulse = (Math.sin(performance.now() * 0.01) + 1) / 2 * 0.3;
                    effectOverlay.style.opacity = Math.min(1, intensity + pulse);
                }

            } else {
                if (!effectOverlay.style.background.includes('rgba(0, 255, 0')) {
                    effectOverlay.style.opacity = 0;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const now = performance.now();

            // UI 更新
            const timeSinceHeal = now - lastHealUseTime;
            if (timeSinceHeal < SKILL_HEAL_CD) {
                const remaining = Math.ceil((SKILL_HEAL_CD - timeSinceHeal) / 1000);
                const percent = 100 - (timeSinceHeal / SKILL_HEAL_CD * 100);
                healOverlay.style.height = percent + '%';
                healTimer.style.display = 'block';
                healTimer.innerText = remaining;
            } else {
                healOverlay.style.height = '0%';
                healTimer.style.display = 'none';
            }

            const timeSinceShield = now - lastShieldUseTime;
            if (timeSinceShield < SKILL_SHIELD_CD) {
                const remaining = Math.ceil((SKILL_SHIELD_CD - timeSinceShield) / 1000);
                const percent = 100 - (timeSinceShield / SKILL_SHIELD_CD * 100);
                shieldUiOverlay.style.height = percent + '%';
                shieldTimer.style.display = 'block';
                shieldTimer.innerText = remaining;
            } else {
                shieldUiOverlay.style.height = '0%';
                shieldTimer.style.display = 'none';
            }

            if (!isGameActive) return;

            const delta = (now - prevTime) / 1000;

            // 移動
            const speed = 150.0; 
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

            const rotation = camera.rotation.y;
            const actualSpeedZ = velocity.z * delta;
            const actualSpeedX = velocity.x * delta;
            const dx = (actualSpeedZ * Math.sin(rotation) - actualSpeedX * Math.cos(rotation));
            const dz = (actualSpeedZ * Math.cos(rotation) + actualSpeedX * Math.sin(rotation));

            const nextX = camera.position.x + dx;
            const nextZ = camera.position.z + dz;

            if (nextX > -BOUNDARY_LIMIT && nextX < BOUNDARY_LIMIT) {
                camera.position.x = nextX;
            } else {
                velocity.x = 0; 
                camera.position.x = Math.max(-BOUNDARY_LIMIT, Math.min(BOUNDARY_LIMIT, nextX));
            }

            if (nextZ > -BOUNDARY_LIMIT && nextZ < BOUNDARY_LIMIT) {
                camera.position.z = nextZ;
            } else {
                velocity.z = 0;
                camera.position.z = Math.max(-BOUNDARY_LIMIT, Math.min(BOUNDARY_LIMIT, nextZ));
            }
            
            camera.position.y = 1.6;

            // 更新子彈
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.add(b.velocity);
                b.life--;
                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // 更新敵人
            if (now - lastEnemySpawnTime > enemySpawnRate) {
                spawnEnemy();
                lastEnemySpawnTime = now;
                if (enemySpawnRate > 500) enemySpawnRate -= 20; 
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                
                // 讓敵人血條面向玩家 (Billboarding)
                const lookDir = new THREE.Vector3();
                lookDir.subVectors(camera.position, e.group.position).normalize();
                
                // 移除 y 軸分量，讓敵人只在水平面旋轉
                lookDir.y = 0; 
                lookDir.normalize();

                e.group.position.add(lookDir.multiplyScalar(e.speed));
                e.group.lookAt(camera.position.x, e.group.position.y, camera.position.z);

                // --- 修正 1: 撞擊玩家判定 (改為水平距離) ---
                // 只計算 X 和 Z 軸的距離，忽略 Y 軸高度差
                const distToPlayer = Math.hypot(e.group.position.x - camera.position.x, e.group.position.z - camera.position.z);

                if (distToPlayer < 1.5) {
                    takeDamage(20);
                    createExplosion(e.group.position, e.type.color, false);
                    scene.remove(e.group);
                    enemies.splice(i, 1);
                    continue;
                }

                // 子彈擊中判斷
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    
                    // --- 修正 2: 子彈命中判定 (改為圓柱體判定) ---
                    // 1. 先算水平距離 (XZ平面)
                    const distXZ = Math.hypot(b.mesh.position.x - e.group.position.x, b.mesh.position.z - e.group.position.z);
                    
                    // 2. 再算垂直高度 (Y軸)
                    const bulletY = b.mesh.position.y;
                    const enemyBottomY = e.group.position.y;
                    // 敵人總高度約為 2.0 * scale (身體+頭+血條)
                    const enemyTopY = enemyBottomY + (2.0 * e.type.scale);

                    // 判定條件：水平距離在半徑內 且 高度在敵人身高範圍內
                    // 寬度判定稍微放寬一點 (+0.5) 讓手感更好
                    if (distXZ < e.type.scale + 0.5 && bulletY > enemyBottomY && bulletY < enemyTopY) { 
                        
                        // --- 頭部判定邏輯 ---
                        const relY = b.mesh.position.y - e.group.position.y;
                        const scale = e.type.scale;
                        
                        const isHeadshot = relY > (1.1 * scale);
                        const damage = isHeadshot ? 2 : 1;

                        createExplosion(b.mesh.position, isHeadshot ? 0xffff00 : 0xffffaa, isHeadshot); 
                        
                        scene.remove(b.mesh);
                        bullets.splice(j, 1);
                        
                        e.currentHp -= damage;
                        
                        // 更新血條顯示 (X軸縮放)
                        const hpPercent = Math.max(0, e.currentHp / e.maxHp);
                        e.hpBarMesh.scale.x = hpPercent;

                        if (e.currentHp <= 0) {
                            createExplosion(e.group.position, e.type.color, isHeadshot); 
                            if (e.type.isHealer) healPlayer(20);
                            scene.remove(e.group);
                            enemies.splice(i, 1);
                            score += e.type.score * (isHeadshot ? 2 : 1); // 爆頭分數也加倍
                            updateUI();
                        } else {
                            // 擊退
                            e.group.position.add(lookDir.multiplyScalar(-2));
                        }
                        break;
                    }
                }
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.velocity);
                p.life--;
                p.mesh.scale.multiplyScalar(0.9);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            updateProximityWarning();

            prevTime = now;
            renderer.render(scene, camera);
        }

        function takeDamage(amount) {
            if (isShieldActive) return; 

            health -= amount;
            if (health < 0) health = 0;
            updateUI();
            
            effectOverlay.style.background = 'radial-gradient(circle, transparent 20%, rgba(255, 0, 0, 0.8) 100%)';
            effectOverlay.style.opacity = 1;
            setTimeout(() => { 
                if (health > 0) effectOverlay.style.opacity = 0; 
            }, 200);

            if (health === 0) gameOver();
        }

        function updateUI() {
            scoreEl.innerText = score;
            healthBarEl.style.width = health + '%';
            healthTextEl.innerText = health + '%';
            
            if (health > 50) healthBarEl.style.backgroundColor = '#00ffcc';
            else if (health > 20) healthBarEl.style.backgroundColor = '#ffaa00';
            else healthBarEl.style.backgroundColor = '#ff0000';

            let rankTitle = "實習生";
            let rankColor = "#fff";

            if (score >= 1000) { rankTitle = "射擊大師"; rankColor = "#ff00ff"; }
            else if (score >= 500) { rankTitle = "菜雞"; rankColor = "#ff4400"; }
            else if (score >= 100) { rankTitle = "菜就多練"; rankColor = "#ffff00"; }

            rankEl.innerText = rankTitle;
            rankEl.style.color = rankColor;
            rankEl.style.textShadow = `0 0 10px ${rankColor}`;
        }

        function gameOver() {
            isGameActive = false;
            document.exitPointerLock();
            menuScreen.style.display = 'flex';
            gameTitle.innerText = "遊戲結束";
            startBtn.innerText = `重新開始 (稱號: ${rankEl.innerText})`;
            gameTitle.style.color = "#ff0000";
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

    </script>
