<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易 3D 射擊遊戲 - RPG進化版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* 遊戲 UI 覆蓋層 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 讓點擊穿透到 Canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 抬頭顯示器 (HUD) */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hud-text {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 5px #00ffcc;
        }

        .rank-text {
            color: #ffaa00;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 0 10px #ff4400;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .level-badge {
            background: #ffaa00;
            color: black;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 20px;
        }

        .status-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        /* 條狀圖容器通用樣式 */
        .bar-container {
            width: 220px;
            height: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 2px;
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 2;
        }

        /* 血量條 */
        .health-container { border-color: #00ffcc; }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #00ffcc;
            transition: width 0.2s;
        }

        /* 經驗條 */
        .xp-container { border-color: #ffd700; height: 16px; width: 220px;}
        #xp-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b8860b, #ffd700);
            transition: width 0.2s;
        }

        /* 技能區塊容器 */
        .skills-wrapper {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        /* 技能 UI */
        .skill-container {
            position: relative;
            width: 50px;
            height: 50px;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .skill-icon { font-size: 20px; color: #00ffcc; z-index: 2; }
        .skill-key { font-size: 10px; color: #fff; position: absolute; bottom: 1px; right: 3px; z-index: 2; }

        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1;
            transition: height 0.1s linear;
        }

        .skill-timer {
            position: absolute;
            font-size: 16px;
            color: white;
            font-weight: bold;
            z-index: 3;
            display: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; position: absolute; background: white; content: ''; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; position: absolute; background: white; content: ''; }

        /* 特效層 */
        #effect-overlay, #shield-overlay, #levelup-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        #shield-overlay {
            transition: opacity 0.3s;
            box-shadow: inset 0 0 100px rgba(0, 200, 255, 0.6);
            border: 4px solid rgba(0, 200, 255, 0.4);
            background: radial-gradient(circle, transparent 60%, rgba(0, 200, 255, 0.2) 100%);
        }

        #levelup-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-shadow: 0 0 20px gold;
        }
        
        .levelup-text {
            font-size: 80px;
            font-weight: 900;
            color: #ffd700;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 選單 */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.95);
            display: flex; align-items: center; justify-content: center;
            color: white; z-index: 10; pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        .menu-content {
            display: flex; flex-direction: column; align-items: center;
            max-width: 800px; width: 90%;
            border: 2px solid #00ffcc; border-radius: 15px; padding: 30px;
            background: rgba(0, 0, 0, 0.6); box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
        }
        h1 { font-size: 42px; margin: 0 0 20px 0; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; text-transform: uppercase; }
        .tutorial-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; width: 100%; margin-bottom: 30px; text-align: left; }
        .tutorial-section h3 { color: #ffaa00; border-bottom: 1px solid #ffaa00; padding-bottom: 5px; margin-bottom: 15px; }
        .key-badge { background: #333; border: 1px solid #666; border-radius: 4px; padding: 2px 8px; font-family: monospace; color: #fff; margin-right: 5px; font-weight: bold; }
        .info-row { margin-bottom: 8px; font-size: 16px; color: #ddd; }
        .enemy-tag { font-weight: bold; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); }
        button { padding: 15px 50px; font-size: 24px; background: transparent; color: #00ffcc; border: 2px solid #00ffcc; border-radius: 5px; cursor: pointer; transition: all 0.3s; font-weight: bold; margin-top: 10px; }
        button:hover { background: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; transform: scale(1.05); }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-left">
                <div class="hud-text">得分: <span id="score">0</span></div>
                <div class="rank-text">
                    <span id="level-badge" class="level-badge">LV.1</span>
                    <span id="rank">列兵</span>
                </div>
            </div>
            
            <div class="status-area">
                <!-- 血量 -->
                <div class="bar-container health-container">
                    <div id="health-text" class="bar-text">HP 100%</div>
                    <div id="health-bar"></div>
                </div>
                
                <!-- 經驗值 -->
                <div class="bar-container xp-container">
                    <div id="xp-text" class="bar-text">XP 0 / 100</div>
                    <div id="xp-bar"></div>
                </div>

                <div class="skills-wrapper">
                    <div class="skill-container">
                        <div class="skill-icon">➕</div>
                        <div class="skill-key">F</div>
                        <div id="skill-heal-overlay" class="cooldown-overlay"></div>
                        <div id="skill-heal-timer" class="skill-timer">10</div>
                    </div>
                    <div class="skill-container" style="border-color: #00ccff;">
                        <div class="skill-icon" style="color: #00ccff;">🛡️</div>
                        <div class="skill-key">Space</div>
                        <div id="skill-shield-overlay" class="cooldown-overlay"></div>
                        <div id="skill-shield-timer" class="skill-timer">15</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="effect-overlay"></div>
    <div id="shield-overlay"></div>
    <div id="levelup-overlay">
        <div class="levelup-text">LEVEL UP!</div>
        <div style="font-size: 24px; color: white;">傷害 & 射速提升</div>
    </div>

    <div id="menu-screen">
        <div class="menu-content">
            <h1>幾何射擊 3D：戰術進化</h1>
            
            <div class="tutorial-grid">
                <div class="tutorial-section">
                    <h3>操作指南 (Controls)</h3>
                    <div class="info-row"><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> 移動</div>
                    <div class="info-row"><span class="key-badge">滑鼠</span> 瞄準 (按住左鍵連發)</div>
                    <div class="info-row"><span class="key-badge">F</span> 補血 (40% HP)</div>
                    <div class="info-row"><span class="key-badge">Space</span> 護盾 (3秒無敵)</div>
                    
                    <h3 style="margin-top: 20px; color: #ffd700; border-color: #ffd700;">成長系統 (RPG)</h3>
                    <div class="info-row">
                        擊殺敵人獲得 <span style="color: #ffd700;">XP</span><br>
                        升級可提升 <span style="color: #ff4444;">傷害</span> 與 <span style="color: #00ffcc;">連發射速</span>
                    </div>
                </div>

                <div class="tutorial-section">
                    <h3 style="color: #ff4444; border-color: #ff4444;">敵人情報 (XP)</h3>
                    <div class="info-row"><span class="enemy-tag" style="color: #ffff00;">黃色</span> 偵察兵 (10 XP)</div>
                    <div class="info-row"><span class="enemy-tag" style="color: #ff4444;">紅色</span> 突擊兵 (30 XP)</div>
                    <div class="info-row"><span class="enemy-tag" style="color: #d000d0;">紫色</span> 重裝坦克 (100 XP)</div>
                    <div class="info-row"><span class="enemy-tag" style="color: #0088ff;">藍色</span> 補給機 (50 XP)</div>
                    
                    <div style="margin-top: 20px; padding: 10px; background: rgba(255, 170, 0, 0.2); border-left: 4px solid #ffaa00;">
                        <strong>⚠️ 戰術提示：</strong><br>
                        瞄準<span style="color: #ffaa00;">頭部</span>造成 <span style="color: yellow;">200%</span> 傷害！
                    </div>
                </div>
            </div>

            <button id="start-btn">開始任務</button>
        </div>
    </div>

    <script>
        // --- 核心變數 ---
        let camera, scene, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // 遊戲狀態
        let isGameActive = false;
        let score = 0;
        let health = 100;
        
        // RPG 數值系統
        let playerLevel = 1;
        let currentXp = 0;
        let xpToNextLevel = 100;
        let baseDamage = 1; 
        let currentDamage = 1;
        
        // 射擊系統 (連發)
        let isMouseDown = false;
        let lastShotTime = 0;
        let baseFireRate = 400; // 初始射速 (毫秒)
        let currentFireRate = 400;

        // 生成與技能
        let lastEnemySpawnTime = 0;
        let enemySpawnRate = 2000; 
        const MAP_SIZE = 200; 
        const BOUNDARY_LIMIT = (MAP_SIZE / 2) - 2; 

        // 技能 CD
        const SKILL_HEAL_CD = 10000; 
        let lastHealUseTime = -SKILL_HEAL_CD; 
        const SKILL_SHIELD_CD = 15000; 
        const SHIELD_DURATION = 3000; 
        let lastShieldUseTime = -SKILL_SHIELD_CD;
        let isShieldActive = false;

        // 物件
        const bullets = [];
        const enemies = [];
        const particles = []; 

        // DOM
        const scoreEl = document.getElementById('score');
        const rankEl = document.getElementById('rank');
        const levelBadgeEl = document.getElementById('level-badge');
        const healthBarEl = document.getElementById('health-bar');
        const healthTextEl = document.getElementById('health-text');
        const xpBarEl = document.getElementById('xp-bar');
        const xpTextEl = document.getElementById('xp-text');
        
        const menuScreen = document.getElementById('menu-screen');
        const startBtn = document.getElementById('start-btn');
        const effectOverlay = document.getElementById('effect-overlay');
        const shieldOverlay = document.getElementById('shield-overlay');
        const levelupOverlay = document.getElementById('levelup-overlay');

        const healOverlay = document.getElementById('skill-heal-overlay');
        const healTimer = document.getElementById('skill-heal-timer');
        const shieldUiOverlay = document.getElementById('skill-shield-overlay');
        const shieldTimer = document.getElementById('skill-shield-timer');

        // 敵人配置 (增加 xpReward)
        const EnemyTypes = {
            YELLOW: { color: 0xffff00, speed: 0.08, hp: 2, score: 10, xp: 10, scale: 0.8, maxHp: 2 },
            RED:    { color: 0xff0000, speed: 0.05, hp: 4, score: 30, xp: 30, scale: 1.0, maxHp: 4 },
            PURPLE: { color: 0x800080, speed: 0.03, hp: 8, score: 100, xp: 100, scale: 1.5, maxHp: 8 },
            BLUE:   { color: 0x0088ff, speed: 0.06, hp: 3, score: 50, xp: 50, scale: 0.9, isHealer: true, maxHp: 3 } 
        };

        // 稱號列表
        const RankTitles = [
            { level: 1, title: "列兵" },
            { level: 3, title: "下士" },
            { level: 6, title: "中尉" },
            { level: 10, title: "少校" },
            { level: 15, title: "上校" },
            { level: 20, title: "少將" },
            { level: 30, title: "戰神" }
        ];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 0, 75); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6; 
            camera.rotation.order = "YXZ"; 

            const ambientLight = new THREE.AmbientLight(0x606060); 
            scene.add(ambientLight);
            
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);

            const pointLight = new THREE.PointLight(0xffffff, 0.8, 50);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            const floorGeometry = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 100, 100);
            floorGeometry.rotateX(-Math.PI / 2);
            const floorMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            scene.add(floor);

            createBoundaries();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            // 改為監聽按下與放開，實現連發
            document.addEventListener('mousedown', (e) => { if(e.button === 0) isMouseDown = true; });
            document.addEventListener('mouseup', () => { isMouseDown = false; });
            
            startBtn.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isGameActive = true;
                    menuScreen.style.display = 'none';
                    if (health <= 0) resetGame();
                } else {
                    isGameActive = false;
                    isMouseDown = false; // 暫停時停止射擊
                    menuScreen.style.display = 'flex';
                    startBtn.innerText = "繼續戰鬥";
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (isGameActive) {
                    const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                    const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;
                    camera.rotation.y -= movementX * 0.002;
                    camera.rotation.x -= movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
                }
            });
        }

        function createBoundaries() {
            const wallMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
            const wallHeight = 20;
            const wallGeo = new THREE.PlaneGeometry(MAP_SIZE, wallHeight, 20, 5);
            
            const wallN = new THREE.Mesh(wallGeo, wallMaterial); wallN.position.set(0, wallHeight/2, -MAP_SIZE/2); scene.add(wallN);
            const wallS = new THREE.Mesh(wallGeo, wallMaterial); wallS.position.set(0, wallHeight/2, MAP_SIZE/2); scene.add(wallS);
            const wallE = new THREE.Mesh(wallGeo, wallMaterial); wallE.rotation.y = -Math.PI / 2; wallE.position.set(MAP_SIZE/2, wallHeight/2, 0); scene.add(wallE);
            const wallW = new THREE.Mesh(wallGeo, wallMaterial); wallW.rotation.y = Math.PI / 2; wallW.position.set(-MAP_SIZE/2, wallHeight/2, 0); scene.add(wallW);
        }

        function resetGame() {
            score = 0;
            health = 100;
            
            // 重置 RPG 數值
            playerLevel = 1;
            currentXp = 0;
            xpToNextLevel = 100;
            updateStats(); // 重置傷害與射速

            lastHealUseTime = -SKILL_HEAL_CD;
            lastShieldUseTime = -SKILL_SHIELD_CD;
            isShieldActive = false;
            shieldOverlay.style.opacity = 0;
            updateUI();
            
            enemies.forEach(e => scene.remove(e.group));
            enemies.length = 0;
            bullets.forEach(b => scene.remove(b.mesh));
            bullets.length = 0;

            camera.position.set(0, 1.6, 0);
            camera.rotation.set(0, 0, 0);
            effectOverlay.style.opacity = 0;
        }

        // 根據等級更新數值
        function updateStats() {
            // 傷害成長：每級增加 0.2 倍
            currentDamage = baseDamage + (playerLevel - 1) * 0.2;
            
            // 射速成長：每級減少 5% 間隔，最低 100ms
            // Lv1: 400ms, Lv5: 325ms, Lv10: 250ms, Lv20: 150ms
            currentFireRate = Math.max(80, baseFireRate * Math.pow(0.95, playerLevel - 1));
        }

        function gainXp(amount) {
            currentXp += amount;
            // 檢查升級
            while (currentXp >= xpToNextLevel) {
                currentXp -= xpToNextLevel;
                playerLevel++;
                
                // 下一級所需經驗成長 (1.2倍)
                xpToNextLevel = Math.floor(xpToNextLevel * 1.2);
                
                updateStats();
                showLevelUpEffect();
            }
            updateUI();
        }

        function showLevelUpEffect() {
            levelupOverlay.style.opacity = 1;
            // 2秒後淡出
            setTimeout(() => {
                levelupOverlay.style.opacity = 0;
            }, 2000);
            
            // 播放升級音效 (這裡用特效代替)
            healPlayer(100); // 升級回滿血獎勵
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'KeyF': useHealSkill(); break; 
                case 'Space': useShieldSkill(); break; 
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        }

        function useHealSkill() {
            if (!isGameActive || health <= 0) return;
            const now = performance.now();
            if (now - lastHealUseTime >= SKILL_HEAL_CD) {
                healPlayer(40);
                lastHealUseTime = now;
            }
        }

        function useShieldSkill() {
            if (!isGameActive || health <= 0) return;
            const now = performance.now();
            if (now - lastShieldUseTime >= SKILL_SHIELD_CD) {
                isShieldActive = true;
                lastShieldUseTime = now;
                shieldOverlay.style.opacity = 1;
                setTimeout(() => {
                    isShieldActive = false;
                    shieldOverlay.style.opacity = 0;
                }, SHIELD_DURATION);
            }
        }

        function healPlayer(amount) {
            health += amount;
            if (health > 100) health = 100;
            updateUI();
            effectOverlay.style.background = 'radial-gradient(circle, transparent 20%, rgba(0, 255, 0, 0.4) 100%)';
            effectOverlay.style.opacity = 0.8;
            setTimeout(() => { if (health > 0) effectOverlay.style.opacity = 0; }, 300);
        }

        function shoot() {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const bullet = new THREE.Mesh(geometry, material);

            bullet.position.copy(camera.position);
            bullet.position.y -= 0.2; // 槍口位置

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            // 加入一點隨機偏移 (隨著射速變快，後座力稍微增加一點點)
            const spread = Math.max(0, 0.05 - (playerLevel * 0.001)); // 等級越高越準，但連發本身有擴散
            direction.x += (Math.random() - 0.5) * spread;
            direction.y += (Math.random() - 0.5) * spread;
            direction.z += (Math.random() - 0.5) * spread;

            bullets.push({
                mesh: bullet,
                velocity: direction.multiplyScalar(0.8), // 子彈速度
                life: 100
            });

            scene.add(bullet);
            
            // 後座力視覺
            camera.rotation.x += 0.005; 
        }

        function spawnEnemy() {
            let typeConfig = EnemyTypes.YELLOW;
            const rand = Math.random();
            if (rand < 0.1) typeConfig = EnemyTypes.BLUE;
            else if (rand < 0.25) typeConfig = EnemyTypes.PURPLE;
            else if (rand < 0.55) typeConfig = EnemyTypes.RED;
            else typeConfig = EnemyTypes.YELLOW;

            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1, 1, 1);
            const bodyMat = new THREE.MeshPhongMaterial({ color: typeConfig.color, shininess: 100 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            group.add(body);

            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshPhongMaterial({ color: typeConfig.color, shininess: 100 });
            headMat.color.offsetHSL(0, 0, 0.1); 
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.3;
            group.add(head);

            const hpBgGeo = new THREE.PlaneGeometry(1.2, 0.15);
            const hpBgMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
            const hpBg = new THREE.Mesh(hpBgGeo, hpBgMat);
            hpBg.position.y = 1.9;
            group.add(hpBg);

            const hpFgGeo = new THREE.PlaneGeometry(1.2, 0.15);
            const hpFgMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
            const hpFg = new THREE.Mesh(hpFgGeo, hpFgMat);
            hpFg.position.y = 1.9; hpFg.position.z = 0.01;
            group.add(hpFg);

            group.scale.set(typeConfig.scale, typeConfig.scale, typeConfig.scale);

            const angle = Math.random() * Math.PI * 2;
            const radius = 25 + Math.random() * 25;
            const spawnRadius = (MAP_SIZE / 2) - 5; 
            let spawnX = Math.cos(angle) * radius + camera.position.x;
            let spawnZ = Math.sin(angle) * radius + camera.position.z;
            spawnX = Math.max(-spawnRadius, Math.min(spawnRadius, spawnX));
            spawnZ = Math.max(-spawnRadius, Math.min(spawnRadius, spawnZ));

            group.position.set(spawnX, 0, spawnZ);

            // 隨著分數/等級增加敵人基礎血量，保持挑戰性
            const hpScaling = 1 + (playerLevel * 0.1); 

            enemies.push({
                group: group,
                headMesh: head,
                hpBarMesh: hpFg,
                type: typeConfig,
                currentHp: typeConfig.maxHp * hpScaling,
                maxHp: typeConfig.maxHp * hpScaling,
                speed: typeConfig.speed + (score * 0.0001)
            });

            scene.add(group);
        }

        function createExplosion(position, color, isCrit) {
            const count = isCrit ? 16 : 8;
            const pColor = isCrit ? 0xffff00 : color; 
            for (let i = 0; i < count; i++) {
                const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const mat = new THREE.MeshBasicMaterial({ color: pColor });
                const part = new THREE.Mesh(geo, mat);
                part.position.copy(position);
                particles.push({
                    mesh: part,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * (isCrit? 1 : 0.5),
                        (Math.random() - 0.5) * (isCrit? 1 : 0.5),
                        (Math.random() - 0.5) * (isCrit? 1 : 0.5)
                    ),
                    life: 20
                });
                scene.add(part);
            }
        }

        function updateProximityWarning() {
            if (enemies.length === 0 || isShieldActive) { 
                if (effectOverlay.style.background.includes('rgba(255, 0, 0')) effectOverlay.style.opacity = 0;
                return;
            }
            let nearestEnemy = null, minDistance = Infinity;
            enemies.forEach(e => {
                const dist = camera.position.distanceTo(e.group.position);
                if (dist < minDistance) { minDistance = dist; nearestEnemy = e; }
            });

            if (nearestEnemy && minDistance < 15) {
                const intensity = Math.max(0, (15 - minDistance) / 15);
                const enemyDir = new THREE.Vector3().subVectors(nearestEnemy.group.position, camera.position).normalize();
                const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
                const camRight = new THREE.Vector3(); camRight.crossVectors(camDir, new THREE.Vector3(0, 1, 0));
                const dotRight = enemyDir.dot(camRight); const dotForward = enemyDir.dot(camDir); 
                let gradient = '';
                if (dotForward < -0.5) gradient = `linear-gradient(to top, rgba(255,0,0,${intensity}) 0%, transparent 50%)`;
                else if (dotRight > 0.3) gradient = `linear-gradient(to left, rgba(255,0,0,${intensity}) 0%, transparent 50%)`;
                else if (dotRight < -0.3) gradient = `linear-gradient(to right, rgba(255,0,0,${intensity}) 0%, transparent 50%)`;
                else gradient = `radial-gradient(circle, transparent 50%, rgba(255, 0, 0, ${intensity}) 100%)`;
                
                if (!effectOverlay.style.background.includes('rgba(0, 255, 0')) {
                    effectOverlay.style.background = gradient;
                    const pulse = (Math.sin(performance.now() * 0.01) + 1) / 2 * 0.3;
                    effectOverlay.style.opacity = Math.min(1, intensity + pulse);
                }
            } else {
                if (!effectOverlay.style.background.includes('rgba(0, 255, 0')) effectOverlay.style.opacity = 0;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();

            // 技能 UI 更新
            const timeSinceHeal = now - lastHealUseTime;
            if (timeSinceHeal < SKILL_HEAL_CD) {
                healOverlay.style.height = (100 - (timeSinceHeal / SKILL_HEAL_CD * 100)) + '%';
                healTimer.style.display = 'block'; healTimer.innerText = Math.ceil((SKILL_HEAL_CD - timeSinceHeal) / 1000);
            } else { healOverlay.style.height = '0%'; healTimer.style.display = 'none'; }

            const timeSinceShield = now - lastShieldUseTime;
            if (timeSinceShield < SKILL_SHIELD_CD) {
                shieldUiOverlay.style.height = (100 - (timeSinceShield / SKILL_SHIELD_CD * 100)) + '%';
                shieldTimer.style.display = 'block'; shieldTimer.innerText = Math.ceil((SKILL_SHIELD_CD - timeSinceShield) / 1000);
            } else { shieldUiOverlay.style.height = '0%'; shieldTimer.style.display = 'none'; }

            if (!isGameActive) return;

            const delta = (now - prevTime) / 1000;

            // --- 自動連發邏輯 ---
            if (isMouseDown && now - lastShotTime > currentFireRate) {
                shoot();
                lastShotTime = now;
            }

            // 移動
            const speed = 150.0; 
            velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
            direction.z = Number(moveForward) - Number(moveBackward); direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;
            
            const rotation = camera.rotation.y;
            const dx = (velocity.z * delta * Math.sin(rotation) - velocity.x * delta * Math.cos(rotation));
            const dz = (velocity.z * delta * Math.cos(rotation) + velocity.x * delta * Math.sin(rotation));
            const nextX = camera.position.x + dx; const nextZ = camera.position.z + dz;

            if (nextX > -BOUNDARY_LIMIT && nextX < BOUNDARY_LIMIT) camera.position.x = nextX; else { velocity.x = 0; camera.position.x = Math.max(-BOUNDARY_LIMIT, Math.min(BOUNDARY_LIMIT, nextX)); }
            if (nextZ > -BOUNDARY_LIMIT && nextZ < BOUNDARY_LIMIT) camera.position.z = nextZ; else { velocity.z = 0; camera.position.z = Math.max(-BOUNDARY_LIMIT, Math.min(BOUNDARY_LIMIT, nextZ)); }
            camera.position.y = 1.6;

            // 子彈
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.mesh.position.add(b.velocity); b.life--;
                if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
            }

            // 敵人
            if (now - lastEnemySpawnTime > enemySpawnRate) {
                spawnEnemy(); lastEnemySpawnTime = now;
                if (enemySpawnRate > 500) enemySpawnRate -= 20; 
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const lookDir = new THREE.Vector3().subVectors(camera.position, e.group.position); lookDir.y = 0; lookDir.normalize();
                e.group.position.add(lookDir.multiplyScalar(e.speed));
                e.group.lookAt(camera.position.x, e.group.position.y, camera.position.z);

                const distToPlayer = Math.hypot(e.group.position.x - camera.position.x, e.group.position.z - camera.position.z);
                if (distToPlayer < 1.5) {
                    takeDamage(20); createExplosion(e.group.position, e.type.color, false);
                    scene.remove(e.group); enemies.splice(i, 1); continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const distXZ = Math.hypot(b.mesh.position.x - e.group.position.x, b.mesh.position.z - e.group.position.z);
                    const bulletY = b.mesh.position.y;
                    const enemyBottomY = e.group.position.y;
                    const enemyTopY = enemyBottomY + (2.0 * e.type.scale);

                    if (distXZ < e.type.scale + 0.5 && bulletY > enemyBottomY && bulletY < enemyTopY) { 
                        const relY = b.mesh.position.y - e.group.position.y;
                        const isHeadshot = relY > (1.1 * e.type.scale);
                        
                        // 計算最終傷害 (基礎傷害 * 等級加成 * 爆頭倍率)
                        const damage = currentDamage * (isHeadshot ? 2 : 1);

                        createExplosion(b.mesh.position, isHeadshot ? 0xffff00 : 0xffffaa, isHeadshot); 
                        scene.remove(b.mesh); bullets.splice(j, 1);
                        
                        e.currentHp -= damage;
                        e.hpBarMesh.scale.x = Math.max(0, e.currentHp / e.maxHp);

                        if (e.currentHp <= 0) {
                            createExplosion(e.group.position, e.type.color, isHeadshot); 
                            if (e.type.isHealer) healPlayer(20);
                            scene.remove(e.group); enemies.splice(i, 1);
                            
                            score += e.type.score * (isHeadshot ? 2 : 1);
                            gainXp(e.type.xp); // 獲得經驗值
                            
                            updateUI();
                        } else {
                            e.group.position.add(lookDir.multiplyScalar(-2));
                        }
                        break;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.mesh.position.add(p.velocity); p.life--; p.mesh.scale.multiplyScalar(0.9);
                if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }

            updateProximityWarning();
            prevTime = now;
            renderer.render(scene, camera);
        }

        function takeDamage(amount) {
            if (isShieldActive) return; 
            health -= amount; if (health < 0) health = 0;
            updateUI();
            effectOverlay.style.background = 'radial-gradient(circle, transparent 20%, rgba(255, 0, 0, 0.8) 100%)';
            effectOverlay.style.opacity = 1;
            setTimeout(() => { if (health > 0) effectOverlay.style.opacity = 0; }, 200);
            if (health === 0) gameOver();
        }

        function updateUI() {
            scoreEl.innerText = score;
            healthBarEl.style.width = health + '%';
            healthTextEl.innerText = 'HP ' + Math.ceil(health) + '%';
            if (health > 50) healthBarEl.style.backgroundColor = '#00ffcc';
            else if (health > 20) healthBarEl.style.backgroundColor = '#ffaa00';
            else healthBarEl.style.backgroundColor = '#ff0000';

            // 更新經驗條
            const xpPercent = (currentXp / xpToNextLevel) * 100;
            xpBarEl.style.width = xpPercent + '%';
            xpTextEl.innerText = `XP ${currentXp} / ${xpToNextLevel}`;
            
            // 更新等級與稱號
            levelBadgeEl.innerText = 'LV.' + playerLevel;
            
            // 尋找符合等級的稱號
            let currentTitle = "列兵";
            for (let i = RankTitles.length - 1; i >= 0; i--) {
                if (playerLevel >= RankTitles[i].level) {
                    currentTitle = RankTitles[i].title;
                    break;
                }
            }
            rankEl.innerText = currentTitle;
        }

        function gameOver() {
            isGameActive = false; isMouseDown = false;
            document.exitPointerLock();
            menuScreen.style.display = 'flex';
            startBtn.innerText = `重新開始 (最終等級: LV.${playerLevel})`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

    </script>
